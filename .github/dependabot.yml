version: 2

updates:
  # Workflow actions are pinned to major tags (actions/checkout@v7), so patch and
  # minor updates arrive automatically. Dependabot is here for the major bumps a
  # tag will not follow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: 'chore'
    # Bootstrap is handled by bootstrap-update.yaml, which rebuilds dist/, runs the
    # verification checks and reports the class diff. A plain version bump here
    # would land without any of that.
    ignore:
      - dependency-name: bootstrap
    groups:
      build-tooling:
        patterns:
          - sass
          - postcss
          - postcss-cli
          - autoprefixer
          - rtlcss
          - cssnano
      dev-tooling:
        patterns:
          - typescript
          - '@types/*'
          - vite
          - '@playwright/test'
          - sugar-high
