name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build library
        run: npm run build

      # Scope leak, breakpoint drift, and the v4 -> v5 class parity check.
      - name: Verify build output
        run: npm run check

      - name: Build demo
        run: npm run build:demo

      # Keyed on the Playwright version so the cache is invalidated by upgrades
      # rather than serving browsers the new version cannot drive.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On a cache hit the browsers are already present, but the system libraries
      # they link against are not cached, so --with-deps still has to run.
      #
      # The `--` is required: without it npm treats --with-deps as its own config
      # ("Unknown cli config") and never forwards it, so WebKit's system libraries
      # are silently skipped and every WebKit test fails to launch.
      - name: Install Playwright browsers
        run: npm exec -- playwright install --with-deps

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
