name: Draft release

# Manual only. This never runs on push or tag: it must not be possible for a release
# to appear without someone deciding to create one.
#
# It builds the stylesheets, verifies them, packs the dist zip and opens a DRAFT
# release. Nothing is public until you edit the notes and press Publish, and nothing
# here touches npm — `npm publish` stays a deliberate command run by a human.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, e.g. 5.0.0)'
        required: true
        type: string

permissions:
  contents: write        # required to create the draft release and its tag

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag whose name disagrees with package.json would publish a mislabelled
      # artifact, so fail loudly before anything is built.
      - name: Check the version matches package.json
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "::error::input version '${{ inputs.version }}' != package.json version '$pkg'"
            exit 1
          fi
          echo "version $pkg"

      - name: Fail if the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ inputs.version }} already exists — releases are immutable, bump the version"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build stylesheets
        run: npm run build

      - name: Verify build output
        run: npm run check

      - name: Browser tests
        run: |
          npm exec -- playwright install --with-deps
          npm run test:e2e

      - name: Pack the dist zip
        run: npm run pack:dist

      # Draft, so the notes can be reviewed and edited before anyone sees them.
      # generate_notes fills in the commit log; the release body is yours to rewrite.
      - name: Create the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: dist-release/*.zip

      - name: Where to go next
        run: |
          {
            echo "### Draft release ${{ inputs.version }} created"
            echo
            echo "1. Review and edit the notes: <https://github.com/${{ github.repository }}/releases>"
            echo "2. Press **Publish release** — this creates the \`${{ inputs.version }}\` tag"
            echo "3. Then publish to npm from a checkout of that tag:"
            echo
            echo '   ```'
            echo "   git fetch --tags && git checkout ${{ inputs.version }}"
            echo "   npm publish"
            echo '   ```'
            echo
            echo "npm publishing is deliberately not automated."
          } >> "$GITHUB_STEP_SUMMARY"
